name: Build Atlantic packages (armv7hl)

# The 32-bit build, for older phones on armv7hl Sailfish OS. Manual runs only:
# it shares the build host with the aarch64 build and takes hours from a cold
# cache. scripts/armv7/ci-build-armv7.sh runs the usual ci-build.sh inside a
# 32-bit Ubuntu chroot on that host; its caches live apart from the aarch64
# ones under /opt/github-runner/cache/atlantic-armv7.
#
# Not published to GitHub Pages: the aarch64 workflow publishes the zypper repo
# with force_orphan, which would wipe an armv7hl directory beside it. The RPMs
# are this run's artifact and, when asked for, the assets of the rolling
# "armv7hl-preview" pre-release, which a tester can download without an account.
on:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: Also put the RPMs on the armv7hl-preview pre-release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: atlantic-build-armv7hl
  cancel-in-progress: false

jobs:
  build:
    name: Build armv7hl RPMs
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - atlantic
    timeout-minutes: 900
    env:
      CI_ROOT: /opt/github-runner/builds/armv7-${{ github.run_id }}-${{ github.run_attempt }}
      CI_CACHE_ROOT: /opt/github-runner/cache/atlantic-armv7/build
      ARMHF_CHROOT: /opt/github-runner/cache/atlantic-armv7/armhf-noble
      GNUPGHOME: /opt/github-runner/builds/armv7-${{ github.run_id }}-${{ github.run_attempt }}/gnupg
      WORK: ${{ github.workspace }}/..
      BUILD_TOOLS: ${{ github.workspace }}
      BROWSER_SRC: ${{ github.workspace }}/../atlantic-browser
      PUBLIC_SFOS_BASE_VERSION: 5.1.0.11
      # Never seed from the host's aarch64 sysroot: download the armv7hl target.
      LOCAL_SFOS_SOURCE_SYSROOT: /nonexistent
      # 32-bit compilers use up to ~3 GB each on WebCore; 10 jobs fit in RAM.
      NPROC: "10"
      CCACHE_DIR: /opt/github-runner/cache/atlantic-armv7/ccache
      CCACHE_MAXSIZE: 20G
      CCACHE_BASEDIR: /opt/github-runner/cache/atlantic-armv7/build
      CCACHE_NOHASHDIR: "1"
      # The Clang toolchain file is aarch64-only.
      WEBKIT_COMPILER: gcc
      RPM_ITERATION: ${{ github.run_number }}.${{ github.run_attempt }}
      WPE_PREFIX: /opt/github-runner/cache/atlantic-armv7/build/wpe-sfos-prefix
      SYSROOT: /opt/github-runner/cache/atlantic-armv7/sysroot/sfos-sysroot-5.1.0.11
      OUT: /opt/github-runner/builds/armv7-${{ github.run_id }}-${{ github.run_attempt }}/wpe-sfos-rpms
      STAGING: /opt/github-runner/builds/armv7-${{ github.run_id }}-${{ github.run_attempt }}/wpe-sfos-stage
      ARTIFACT_ROOT: ${{ github.workspace }}/artifacts

    steps:
      - name: Reclaim workspace from root-owned leftovers
        run: sudo chown -R "$(id -u)":"$(id -g)" "${GITHUB_WORKSPACE}" || true

      - name: Check out repo
        uses: actions/checkout@v4

      - name: Check out browser repo
        run: |
          set -euo pipefail
          browser_src="$(realpath -m "${BROWSER_SRC}")"
          sudo rm -rf "${browser_src}"
          git clone --depth 1 --branch main https://github.com/SpecSierra/atlantic-browser.git "${browser_src}"
          git -C "${browser_src}" rev-parse --short HEAD

      - name: Reset isolated build directories
        run: |
          set -euo pipefail
          rm -rf "${ARTIFACT_ROOT}"
          mkdir -p "${ARTIFACT_ROOT}"
          sudo rm -rf "${CI_ROOT}"

      - name: Build armv7hl packages in the armhf chroot
        run: |
          set -euo pipefail
          sudo --preserve-env=CI_ROOT,CI_CACHE_ROOT,ARMHF_CHROOT,WORK,BUILD_TOOLS,BROWSER_SRC,PUBLIC_SFOS_BASE_VERSION,LOCAL_SFOS_SOURCE_SYSROOT,WPE_PREFIX,SYSROOT,OUT,STAGING,ARTIFACT_ROOT,NPROC,CCACHE_DIR,CCACHE_MAXSIZE,CCACHE_BASEDIR,CCACHE_NOHASHDIR,RPM_ITERATION,WEBKIT_COMPILER \
            bash "${GITHUB_WORKSPACE}/scripts/armv7/ci-build-armv7.sh"

      - name: Mirror sfos-qcom-boost into the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # wpe-sfos-compat Requires it; it is noarch, so the aarch64 release serves.
          dest="${ARTIFACT_ROOT}/rpms"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          gh release download --repo SpecSierra/sfos-qcom-boost --pattern '*.noarch.rpm' --dir "${tmp}" --clobber
          sudo mkdir -p "${dest}"
          sudo cp "${tmp}"/*.noarch.rpm "${dest}/"

      - name: Sign the RPMs
        env:
          ATLANTIC_RPM_SIGNING_KEY: ${{ secrets.ATLANTIC_RPM_SIGNING_KEY }}
          ATLANTIC_RPM_SIGNING_KEY_ID: ${{ secrets.ATLANTIC_RPM_SIGNING_KEY_ID }}
          ATLANTIC_RPM_SIGNING_PASSPHRASE: ${{ secrets.ATLANTIC_RPM_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ -z "${ATLANTIC_RPM_SIGNING_KEY:-}" ] || [ -z "${ATLANTIC_RPM_SIGNING_KEY_ID:-}" ]; then
            echo "Missing signing secrets. Set ATLANTIC_RPM_SIGNING_KEY and ATLANTIC_RPM_SIGNING_KEY_ID." >&2
            exit 1
          fi
          sudo rm -rf "${GNUPGHOME}"
          sudo mkdir -p "${GNUPGHOME}"
          sudo chmod 700 "${GNUPGHOME}"
          sudo chown "$(id -u)":"$(id -g)" "${GNUPGHOME}"
          printf '%s\n' "${ATLANTIC_RPM_SIGNING_KEY}" | gpg --batch --import
          cat > "${HOME}/.rpmmacros" << MACROS
          %_signature gpg
          %_gpg_name ${ATLANTIC_RPM_SIGNING_KEY_ID}
          %_gpg_path ${GNUPGHOME}
          %_gpgbin /usr/bin/gpg
          %_gpg_digest_algo sha256
          %__gpg /usr/bin/gpg
          %__gpg_sign_cmd %{__gpg} gpg --batch --no-armor --no-verbose --pinentry-mode loopback --passphrase "${ATLANTIC_RPM_SIGNING_PASSPHRASE}" %{?_gpg_digest_algo:--digest-algo %{_gpg_digest_algo}} --no-secmem-warning -u "%{_gpg_name}" -sbo %{__signature_filename} %{__plaintext_filename}
          MACROS
          sudo tee /root/.rpmmacros < "${HOME}/.rpmmacros" > /dev/null
          sudo chmod 600 /root/.rpmmacros
          bundle=("${ARTIFACT_ROOT}/rpms-bundle/"*.rpm)
          rpms=("${ARTIFACT_ROOT}/rpms/"*.rpm "${bundle[@]}")
          if [ "${#rpms[@]}" -eq 0 ]; then
            echo "No RPMs to sign" >&2
            exit 1
          fi
          sudo chown "$(id -u)":"$(id -g)" "${rpms[@]}"
          chmod 644 "${rpms[@]}"
          for rpm_path in "${rpms[@]}"; do
            echo "Signing: ${rpm_path}"
            sudo rpmsign --addsign "${rpm_path}"
          done
          gpg --batch --yes --armor --export "${ATLANTIC_RPM_SIGNING_KEY_ID}" > "${ARTIFACT_ROOT}/RPM-GPG-KEY-atlantic-ci"

      - name: Fix artifact ownership
        if: always()
        run: sudo chown -R "$(id -u)":"$(id -g)" "${ARTIFACT_ROOT}" || true

      - name: Clean signing material
        if: always()
        run: sudo rm -rf "${GNUPGHOME}" "${HOME}/.rpmmacros" /root/.rpmmacros || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlantic-armv7hl-rpms-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish the armv7hl-preview pre-release
        if: inputs.publish_preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag=armv7hl-preview
          gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes 2>/dev/null || true
          printf '%s\n' \
            'Untested build of Atlantic for 32-bit (armv7hl) Sailfish OS 5.1 phones, such as the Xperia 10, XA2 or Jolla C.' \
            '' \
            "Run ${{ github.run_number }}.${{ github.run_attempt }}, commit ${GITHUB_SHA}." \
            '' \
            'Install as root (devel-su), all RPMs together:' \
            '```' \
            'rpm --import RPM-GPG-KEY-atlantic-ci' \
            'zypper in ./*.rpm' \
            '```' \
            > "${RUNNER_TEMP}/notes.md"
          gh release create "${tag}" --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" \
            --prerelease --title "Atlantic armv7hl preview (run ${{ github.run_number }})" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            "${ARTIFACT_ROOT}/rpms/"*.rpm "${ARTIFACT_ROOT}/RPM-GPG-KEY-atlantic-ci"
