name: Refresh adblock lists

# Weekly rebuild of engine.dat from fresh upstream lists, published to the
# Pages adblock/v3/ path (keep_files leaves the rpm repo alone; the main build
# workflow re-adds it itself since its publish is force_orphan). The on-device
# AdBlockListUpdater polls engine.version there and downloads the payload when
# it is newer than the installed copy.
#
# "v3" is adblock-rust's serialized cache FORMAT version, from the engine.dat
# header — not the crate version. An engine rejects any other format, and the
# updater compares epoch stamps only, so a client cannot tell "newer" from
# "unreadable" until it has downloaded ~17 MB. One path per format keeps older
# clients on their last working lists instead. Bump it together with
# kDefaultBaseUrl (browser AdBlockListUpdater.cpp) and build-atlantic-packages.yml.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Required to push the payload to the gh-pages branch. Without it GITHUB_TOKEN
# gets the repository default, which is read-only here, and the publish step
# fails with "Permission to SpecSierra/atlantic-engine.git denied to
# github-actions[bot]" / 403. build-atlantic-packages.yml declares the same
# thing, which is why its Pages publish has always worked and this one never
# did. contents:write is all actions-gh-pages needs — it pushes a branch.
permissions:
  contents: write

concurrency:
  group: refresh-adblock-lists
  cancel-in-progress: false

jobs:
  refresh:
    name: Rebuild and publish filter lists
    runs-on:
      - self-hosted
      - Linux
      - ARM64
      - atlantic
    timeout-minutes: 60

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rebuild filter payload from fresh lists
        env:
          # runner.temp, NOT /opt/github-runner/builds: that tree is root-owned
          # and only the main build workflow can write to it, because that one
          # runs its script under sudo. This job needs no privileges, so it
          # stages in the runner's own temp (auto-cleaned per job) instead.
          STAGING: ${{ runner.temp }}/adblock-refresh-${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/refresh-adblock-lists.sh adblock-out
          rm -rf "${STAGING}"

      - name: Publish to GitHub Pages (adblock/v3/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: adblock-out
          destination_dir: adblock/v3
          keep_files: true
          enable_jekyll: false
          commit_message: "ci: refresh adblock lists ${{ github.run_id }}"
