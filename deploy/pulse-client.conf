# PulseAudio client configuration for Atlantic browser processes
# (exported via PULSE_CLIENTCONFIG in runtime-common.sh — this REPLACES
# /etc/pulse/client.conf for our processes, so it must carry the distro
# defaults too).

# From /etc/pulse/client.conf.d/50-sfos.client.conf: PulseAudio startup is
# managed by the user session; clients must never autospawn a daemon.
autospawn = no

# THE FIX — disable the shared-memory data path (POSIX SHM + memfd/srbchannel)
# between our processes and the PulseAudio server. On the Xperia 10 II (SFOS
# 5.1, PulseAudio 17 + libhybris droid sinks) the SHM transport from the
# WebProcess jams right after a playback stream starts: the server stops
# consuming the stream ~0.5-1.5 s in (exactly the prebuffered audio the user
# hears), logs "protocol-native.c: Failed to push data into queue", leaves the
# sink-input CORKED/muted (later unmute/uncork commands on the jammed
# connection are lost — hence "clicking play/pause + unmute many times
# sometimes fixes it"), and eventually drops the client connection. Video
# keeps playing because the pipeline runs on the system clock
# (webkit-gst-audio-system-clock.patch), so the failure presents as
# "half a second of audio, then silence, video fine".
#
# Plain-socket audio transfer is negligible bandwidth (stereo 48 kHz float =
# ~384 KB/s) and device-verified to play continuously.
enable-shm = no
