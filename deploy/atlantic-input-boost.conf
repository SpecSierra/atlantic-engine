# Atlantic: per-touch CPU boost (read by /usr/libexec/atlantic/atlantic-input-boost.sh).
#
# Arms Qualcomm's cpu_boost driver, which SFOS leaves loaded but zeroed. On a
# touch event the driver imposes a frequency floor on the big cluster for
# ATLANTIC_INPUT_BOOST_MS, without waiting for load to appear — unlike the
# cpufreq governor, which is reactive and can only raise frequency after
# utilization has already been observed.
#
# SCOPE: this is system-wide. cpu_boost fires on any touch anywhere in SFOS
# (lipstick, the launcher, other applications), not only in the browser.
#
# MEASUREMENT NOTE, so nobody re-derives it from scratch: the mechanism is
# device-proven (1 056 000 -> 1 401 600 within 4-5 ms of touch-down, 3/3 taps),
# but a 30-pair A/B on a heavy page found NO touch-to-frame benefit — and the
# effect got smaller, not larger, as trials were conditioned on the boost having
# more leverage. See docs/investigations/latency-levers.md. It is enabled here
# as a product decision, not because the measurement supports it.
#
# Set ATLANTIC_INPUT_BOOST=0 to disable; the service then does nothing.

ATLANTIC_INPUT_BOOST=1

# Frequency floor in kHz, applied to the big cluster. Clamped to the cluster's
# real maximum, so this is safe to leave at the top bin across devices.
ATLANTIC_INPUT_BOOST_FREQ=2016000

# How long the floor is held after each touch.
ATLANTIC_INPUT_BOOST_MS=80

# Also bias freshly-woken tasks onto the big cores (task placement, not
# frequency). UNTESTED — left off deliberately.
ATLANTIC_INPUT_BOOST_SCHED=0
