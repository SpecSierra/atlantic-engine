# Atlantic browser — SFOS PulseAudio policy (xpolicy) stream classification.
# Installed to /etc/pulse/xpolicy.conf.d/; read by module-policy-enforcement
# at PulseAudio startup (a PA restart / reboot is needed after first install).
#
# Without this, WebKit's audio streams match no [stream] rule in
# /etc/pulse/xpolicy.conf and fall into the default "othermedia" group. Both
# groups have the cork_stream flag, but streams the policy engine cannot
# attribute to a known player application get corked by OHM shortly after
# they start: the server stops consuming ~0.5 s in (exactly the prebuffered
# audio), the stream is left corked/muted, and later unmute/uncork commands
# go nowhere — "half a second of audio then silence" while video keeps
# playing. Classification by exe name (the mechanism the stock rules use,
# e.g. exe=pacat -> player) does NOT work for Atlantic because the browser
# runs inside Sailjail/firejail: the PID-namespace hides the client's
# /proc entry from PulseAudio's client-ext ("can't obtain command line" in
# the journal). Matching on the stream property WebKit stamps on every
# audio sink works regardless of sandboxing.
#
# Device-verified (Xperia 10 II, SFOS 5.1.0.11): with this rule the streams
# get policy.group=player and video+audio (mp4, YouTube) plays continuously
# in the jailed browser.
[stream]
property = application.name@equals:"WebKit"
group    = player
