# Native meson file for libwpe/libepoxy/WPEBackend-fdo on armhf Ubuntu (armv7hl build)
# (no sysroot — use host system libs; sysroot only for Qt plugin + browser)
[built-in options]
c_args   = ['-march=armv7-a', '-mfpu=neon', '-mfloat-abi=hard', '-mthumb']
cpp_args = ['-march=armv7-a', '-mfpu=neon', '-mfloat-abi=hard', '-mthumb']
c_link_args   = ['-static-libgcc', '-Wl,--allow-shlib-undefined']
cpp_link_args = ['-static-libstdc++', '-static-libgcc', '-Wl,--allow-shlib-undefined']
